extends: e1_distribution_level_touch_v2.yaml

# Main distribution-level experiment: initialize original MonoDETR tensors
# from the converged checkpoint, reset optimizer/scheduler, and train Pass 1,
# categorical depth-prior fusion, and Pass 2 jointly from epoch 0.
geometry_e1:
  horizon:
    # Keep train/validation geometry identical for the stable training ablation.
    vertical_edge_refinement:
      enabled: false
  fusion:
    initial_alpha: 0.001
    alpha_min: 0.0
    alpha_max: 0.1
  losses:
    fused_depth_map_loss_coef: 0.25
    pass1_aux_detection_loss_coef_phase2: 0.50
  training:
    fusion_start_epoch: 0
    phase1_decoder_passes: 2
    phase2_decoder_passes: 2
    detach_geometry: false
    freeze_pass1: false

trainer:
  # Model weights are imported, but optimizer/scheduler/epoch start fresh.
  pretrain_model: "${MONODETR_CHECKPOINT:-outputs/monodetr/checkpoint_best_1.pth}"
  max_epoch: 30
  save_path: outputs/e1_distribution_joint_epoch0/

validation:
  output_dir: outputs/e1_distribution_joint_epoch0/validation/

logging:
  wandb:
    run_name: e1_distribution_joint_epoch0_seed444
    tags: [monodetr, gpro3d, e1, distribution_level, always_two_pass, pretrained_init]
