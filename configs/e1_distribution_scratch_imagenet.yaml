extends: e1_distribution_joint_epoch0.yaml

# Scratch-detector distribution ablation. No MonoDETR checkpoint is loaded;
# ResNet-50 retains the repository's ImageNet initialization while the
# transformer, depth predictor, detection heads, and E1 modules start randomly.
geometry_e1:
  pretrained_checkpoint: null

  touchpoint:
    loss_coordinate_mode: absolute
    box_detach: true
    
  fusion:
    # The effective gate is sigmoid-parameterized and trained jointly from
    # scratch. It starts non-trivial but remains free to move in (0, 0.1).
    initial_alpha: 0.01
    alpha_min: 0.0
    alpha_max: 0.1
  losses:
    pass1_aux_detection_loss_coef_phase2: 0.25
  training:
    # Pass 1, geometry fusion, and Pass 2 are active from the first batch.
    fusion_start_epoch: 0

optimizer:
  type: adamw
  lr: 0.0002
  weight_decay: 0.0001
  param_groups:
    original_monodetr_lr: 0.0002
    horizon_touchpoint_lr: 0.0002
    geometry_fusion_lr: 0.0001
    fusion_alpha_lr: 0.00001
  grad_clip_norm: 0.1

lr_scheduler:
  type: step
  warmup: true
  decay_rate: 0.1
  decay_list: [125, 165]

trainer:
  pretrain_model: null
  resume_model: null
  max_epoch: 195
  grad_accum_steps: 1
  save_path: outputs/e1_distribution_scratch_imagenet/

validation:
  output_dir: outputs/e1_distribution_scratch_imagenet/validation/

logging:
  wandb:
    run_name: e1_distribution_scratch_imagenet_seed444
    tags: [monodetr, gpro3d, e1, distribution_level, always_two_pass, scratch_detector, imagenet_backbone]
