extends: near_gpro_zmap_replace_scratch.yaml

# Controlled ablation: protect the shared visual backbone from direct geometry
# supervision, while keeping GPro fully coupled to the final object-depth loss.
#
# Forward:
#   Z_final = (Z_query_reg + Z_size + valid_or_fallback(Z_gpro_center, Z_map)) / 3
#
# Backward:
#   - final object-depth loss -> query/size branches and GPro heads
#   - direct horizon/touchpoint/GPro losses -> geometry heads
#   - geometry visual-feature paths -X-> shared detector backbone
#   - auxiliary decoder depth losses remain enabled

random_seed: 444
model_name: near_gpro_zmap_feature_detach_scratch

dataset:
  batch_size: 12

near_gpro:
  horizon:
    visual_feature_detach: true

  near_touchpoint:
    box_detach: true
    visual_feature_detach: true

  center_correction:
    detach_dimensions_yaw: true

  replacement:
    formula: "(Z_query_reg + Z_size + valid_or_fallback(Z_gpro_center, Z_map)) / 3"
    detach_gpro_in_final_depth: false
    min_geometry_confidence: 0.0
    invalid_policy: original_z_map

  losses:
    # Preserve the original auxiliary decoder depth supervision.
    aux_depth_loss_coef: 1.0

optimizer:
  type: adamw
  lr: 0.0002
  weight_decay: 0.0001
  param_groups:
    original_monodetr_lr: 0.0002
    horizon_touchpoint_lr: 0.0002
    geometry_fusion_lr: 0.0001
  grad_clip_norm: 0.1

lr_scheduler:
  type: step
  warmup: true
  decay_rate: 0.1
  decay_list: [200, 230]

trainer:
  pretrain_model: null
  resume_model: null
  max_epoch: 260
  grad_accum_steps: 2
  validation_frequency: 1
  periodic_checkpoint_interval: "${CHECKPOINT_INTERVAL:-10}"
  save_frequency: 20
  save_path: outputs/near_gpro_zmap_feature_detach_scratch/
  save_all: false
  save_last_and_best: true
  gpu_ids: "0"

tester:
  mode: single
  checkpoint: 260
  threshold: 0.2
  topk: 50
  output_variant: final

logging:
  log_every_n_steps: 20
  gradient_norms_every_n_steps: 100
  wandb:
    enabled: true
    mode: "${WANDB_MODE:-offline}"
    project: DACN
    run_name: near_gpro_zmap_feature_detach_scratch_seed444
    tags: [monodetr, gpro3d, near_center, scratch, feature_detach, recall_protected]
