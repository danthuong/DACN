<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>MonoDETR Geometry Debugger</title>
    <link rel="stylesheet" href="/styles.css" />
  </head>
  <body>
    <header class="topbar">
      <div class="brand">
        <span class="brand-mark"></span>
        <div>
          <h1>Geometry Debugger</h1>
          <p id="status">Connecting to local KITTI data…</p>
        </div>
      </div>
      <div class="controls" aria-label="Dashboard controls">
        <button id="previous-frame" type="button" title="Previous frame">←</button>
        <label>Frame <select id="frame-select" aria-label="Frame ID"></select></label>
        <button id="next-frame" type="button" title="Next frame">→</button>
        <details class="model-picker">
          <summary>Models <span id="model-count">0</span></summary>
          <div id="model-options"></div>
        </details>
        <details class="model-picker validation-picker">
          <summary>Validation</summary>
          <div id="validation-summary">
            <label>Distance <select id="validation-distance">
              <option value="overall">Overall</option>
              <option value="0-10">0–10 m</option><option value="10-20">10–20 m</option>
              <option value="20-30">20–30 m</option><option value="30-40">30–40 m</option>
              <option value="40-60">40–60 m</option><option value="60+">≥60 m</option>
            </select></label>
            <div id="validation-table">No validation report yet.</div>
          </div>
        </details>
        <label class="threshold">Confidence
          <input id="confidence" type="range" min="0" max="1" step="0.01" value="0.2" />
          <output id="confidence-value">0.20</output>
        </label>
        <label><input id="toggle-gt" type="checkbox" checked /> GT boxes</label>
        <label><input id="toggle-pred" type="checkbox" checked /> Predictions</label>
        <label><input id="toggle-touch" type="checkbox" checked /> Touch points</label>
        <label><input id="toggle-reproject" type="checkbox" /> Reproject touch points</label>
        <output id="dataset-reprojection-mae" class="metric-chip">Dataset |ΔZ| MAE —</output>
        <label><input id="toggle-horizon" type="checkbox" checked /> Horizon</label>
        <label><input id="toggle-arrows" type="checkbox" checked /> Depth shift</label>
      </div>
    </header>

    <main class="view-grid">
      <section class="viewer camera-view" aria-label="Camera image viewer">
        <div class="viewer-title">
          <h2>Camera image</h2>
          <span id="camera-readout">—</span>
        </div>
        <div class="canvas-wrap"><canvas id="camera-canvas"></canvas></div>
      </section>

      <section class="viewer bev-view" aria-label="BEV depth shift viewer">
        <div class="viewer-title">
          <h2>BEV depth shift</h2>
          <span id="bev-readout">Drag to pan · Wheel to zoom</span>
        </div>
        <div class="canvas-wrap"><canvas id="bev-canvas"></canvas></div>
      </section>
    </main>

    <script src="/app.js" defer></script>
  </body>
</html>
